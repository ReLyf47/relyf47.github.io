<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Fallback cover for games with no Steam artwork (matches the XMB page palette) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#06b6d4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <path d="M0 610 C150 560 300 680 450 620 S600 590 600 590" fill="none" stroke="url(#wave)" stroke-width="3"/>
  <path d="M0 650 C170 600 280 720 440 660 S600 640 600 640" fill="none" stroke="url(#wave)" stroke-width="1.5" opacity=".6"/>
  <g transform="translate(300 380)" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <path d="M-120 -40 h240 a60 60 0 0 1 58 74 l-22 90 a40 40 0 0 1 -66 18 l-40 -42 h-140 l-40 42 a40 40 0 0 1 -66 -18 l-22 -90 a60 60 0 0 1 58 -74z"/>
    <path d="M-80 10 v40 M-100 30 h40"/>
    <circle cx="70" cy="20" r="6" fill="#06b6d4" stroke="none"/>
    <circle cx="100" cy="45" r="6" fill="#8b5cf6" stroke="none"/>
  </g>
  <text x="300" y="560" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="8" fill="#64748b">NO ARTWORK</text>
</svg>
