<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Drop shadow -->
  <rect x="7" y="7" width="52" height="52" rx="14" fill="#08090D" opacity="0.35"/>
  <!-- Yellow Memphis Badge -->
  <rect x="5" y="5" width="52" height="52" rx="14" fill="#FFE600" stroke="#08090D" stroke-width="3.5"/>
  
  <!-- Back book layer (Indigo) -->
  <rect x="18" y="16" width="30" height="34" rx="4" fill="#6366F1" stroke="#08090D" stroke-width="2.5"/>
  <!-- Middle book pages (Paper White) -->
  <rect x="15" y="14" width="30" height="34" rx="4" fill="#FFFFFF" stroke="#08090D" stroke-width="2.5"/>
  <!-- Front book cover (Neon Pink) -->
  <rect x="12" y="12" width="30" height="34" rx="4" fill="#FF2A55" stroke="#08090D" stroke-width="2.5"/>
  <line x1="16" y1="12" x2="16" y2="46" stroke="#08090D" stroke-width="2.5"/>
  
  <!-- Sparkle Star on Cover -->
  <path d="M 28 18 Q 28 25 21 25 Q 28 25 28 32 Q 28 25 35 25 Q 28 25 28 18 Z" fill="#FFE600" stroke="#08090D" stroke-width="1.8" stroke-linejoin="round"/>
  
  <!-- Cute Mini Sparkle in corner -->
  <path d="M 47 11 Q 47 16 42 16 Q 47 16 47 21 Q 47 16 52 16 Q 47 16 47 11 Z" fill="#FFFFFF" stroke="#08090D" stroke-width="1.6" stroke-linejoin="round"/>
